<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caloria·AR | Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <style>
        :root {
            --bg:#F5F1EB; --surface:#FFFFFF; --surface2:#EDE9E1;
            --green:#2A4A2A; --green-mid:#3D6B3D; --green-lt:#D4E8D4;
            --terra:#C4614A; --terra-lt:#F5E0DB;
            --text:#1C1C1A; --text2:#6B6860; --text3:#A09D98;
            --border:rgba(0,0,0,.08); --r:24px; --r-sm:14px;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;min-height:100vh;overflow-x:hidden}
        .hidden{display:none!important}

        /* ── LAYOUT ─── */
        .app-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; background: var(--bg); display: flex; flex-direction: column; }
        header { padding: 1.5rem 1.25rem 0.5rem; display: flex; align-items: center; justify-content: space-between; }
        .brand { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.4rem; color: var(--green); letter-spacing: -0.03em; }
        .brand span { color: var(--terra); }

        /* ── CARDS ─── */
        .card { background: var(--surface); border-radius: var(--r); padding: 1.25rem; border: 1px solid var(--border); margin: 0 1.25rem 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .card-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; margin-bottom: 1rem; }

        /* ── RING ─── */
        .ring-card { background: var(--green); color: white; display: flex; align-items: center; gap: 1.5rem; border: none; padding: 1.5rem; }
        .ring-wrap { position: relative; width: 100px; height: 100px; flex-shrink: 0; }
        .ring-svg { transform: rotate(-90deg); width: 100px; height: 100px; }
        .ring-track { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 10; }
        .ring-fill { fill: none; stroke: #7DC97D; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 283; stroke-dashoffset: 283; transition: 1s ease; }
        .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ring-cal { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.4rem; line-height: 1; }
        .ring-unit { font-size: 0.6rem; font-weight: 700; opacity: 0.7; }

        /* ── MACROS ─── */
        .macros-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin: 0 1.25rem 1rem; }
        .macro-pill { background: white; border: 1px solid var(--border); border-radius: var(--r-sm); padding: 0.8rem 0.5rem; text-align: center; }
        .m-val { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; display: block; }
        .m-lbl { font-size: 0.65rem; color: var(--text3); font-weight: 700; text-transform: uppercase; }

        /* ── LISTS ─── */
        .meal-group { margin-bottom: 1rem; }
        .meal-hd { padding: 0.5rem 1.5rem; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; color: var(--text3); display: flex; justify-content: space-between; }
        .food-item { background: white; margin: 0 1.25rem 0.5rem; padding: 1rem; border-radius: var(--r-sm); display: flex; align-items: center; gap: 0.8rem; border: 1px solid var(--border); transition: 0.2s; }
        .food-info { flex: 1; min-width: 0; }
        .food-n { font-weight: 700; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .food-d { font-size: 0.72rem; color: var(--text3); }
        .food-c { font-family: 'Syne', sans-serif; font-weight: 700; color: var(--green); }
        .btn-del { background: none; border: none; color: var(--text3); cursor: pointer; padding: 5px; font-size: 1.1rem; }

        /* ── IMC & PESO ─── */
        .imc-badge { background: var(--green-lt); color: var(--green); padding: 2rem 1rem; border-radius: var(--r); text-align: center; margin: 0 1.25rem 1.5rem; }
        .imc-num { font-family: 'Syne', sans-serif; font-size: 3rem; font-weight: 800; line-height: 1; }
        .imc-cat { font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em; margin-top: 0.5rem; }

        /* ── FORMS ─── */
        .form-label { display: block; font-size: 0.7rem; font-weight: 800; color: var(--text3); text-transform: uppercase; margin-bottom: 0.4rem; padding-left: 4px; }
        .form-input { width: 100%; padding: 0.9rem 1.1rem; border-radius: var(--r-sm); border: 1.5px solid var(--border); background: var(--surface); font-family: inherit; font-size: 0.95rem; margin-bottom: 1rem; outline: none; transition: 0.2s; }
        .form-input:focus { border-color: var(--green); background: white; }
        .btn-primary { width: 100%; padding: 1.1rem; background: var(--green); color: white; border: none; border-radius: var(--r-sm); font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn-primary:active { transform: scale(0.98); }

        /* ── NAVIGATION ─── */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid var(--border); display: flex; height: 5rem; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: var(--text3); font-size: 0.65rem; font-weight: 700; }
        .nav-item.active { color: var(--green); }
        .nav-icon { font-size: 1.3rem; }
        .fab { position: fixed; bottom: 6.5rem; right: 1.5rem; width: 56px; height: 56px; background: var(--terra); color: white; border-radius: 50%; border: none; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(196,97,74,0.3); z-index: 90; cursor: pointer; }

        /* ── PANELS ─── */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: none; backdrop-filter: blur(2px); }
        .overlay.open { display: block; }
        .panel { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 480px; background: white; border-radius: 32px 32px 0 0; z-index: 201; transition: 0.4s cubic-bezier(0, 1, 0, 1); padding: 2rem 1.5rem 2.5rem; }
        .panel.open { transform: translateX(-50%) translateY(0); }

        /* ── AUTH SPLASH ─── */
        .disclaimer-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .disclaimer-box { background: white; padding: 2.5rem 2rem; border-radius: 32px; text-align: center; border: 1px solid var(--border); }
    </style>
</head>
<body>

<div id="disclaimer" class="disclaimer-overlay">
    <div class="disclaimer-box">
        <div style="font-size: 3rem; margin-bottom: 1rem;">🥗</div>
        <div class="brand" style="font-size: 2rem; margin-bottom: 0.5rem;">Caloria<span>·</span>AR</div>
        <p style="color: var(--text2); font-size: 0.85rem; line-height: 1.6; margin-bottom: 2rem;">Proyecto académico UNPAZ. Consulta a tu médico antes de realizar cambios nutricionales.</p>
        <button class="btn-primary" onclick="aceptarDisclaimer()">Empezar ahora</button>
    </div>
</div>

<div id="view-auth" class="app-shell hidden" style="justify-content: center;">
    <div class="card" style="padding: 2.5rem 2rem;">
        <div class="brand" style="text-align: center; font-size: 2.2rem; margin-bottom: 1.5rem;">Caloria<span>·</span>AR</div>
        <div style="display: flex; background: var(--bg); border-radius: 14px; padding: 4px; margin-bottom: 1.5rem;">
            <div id="t-login" class="nav-item active" onclick="switchAuth('login')" style="flex:1; padding: 0.75rem; border-radius: 11px;">Entrar</div>
            <div id="t-reg" class="nav-item" onclick="switchAuth('reg')" style="flex:1; padding: 0.75rem; border-radius: 11px;">Registrarse</div>
        </div>
        <div id="f-login">
            <input class="form-input" type="email" id="l-email" placeholder="Email">
            <input class="form-input" type="password" id="l-pass" placeholder="Contraseña">
            <button class="btn-primary" onclick="doLogin()">Entrar</button>
        </div>
        <div id="f-reg" class="hidden">
            <input class="form-input" type="text" id="r-nombre" placeholder="Nombre completo">
            <input class="form-input" type="email" id="r-email" placeholder="Email">
            <input class="form-input" type="password" id="r-pass" placeholder="Contraseña (mín 8)">
            <button class="btn-primary" onclick="doRegister()">Crear Cuenta</button>
        </div>
    </div>
</div>

<div id="view-dash" class="app-shell hidden">
    <header>
        <div>
            <div class="brand">Caloria<span>·</span>AR</div>
            <div id="fecha-label" style="font-size: 0.75rem; font-weight: 700; color: var(--text3); text-transform: uppercase; margin-top: 2px;">Martes 24 de Marzo</div>
        </div>
        <button onclick="doLogout()" style="border: none; background: var(--surface2); width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 1.2rem;">🚪</button>
    </header>

    <div id="sec-calorias">
        <div style="display: flex; justify-content: space-between; padding: 0.5rem 1.25rem 1rem;">
            <button onclick="cambiarFecha(-1)" style="border:none; background:none; font-weight:700; color:var(--text2)">‹ Anterior</button>
            <button onclick="cambiarFecha(1)" style="border:none; background:none; font-weight:700; color:var(--text2)">Siguiente ›</button>
        </div>

        <div class="card ring-card">
            <div class="ring-wrap">
                <svg class="ring-svg" viewBox="0 0 100 100">
                    <circle class="ring-track" cx="50" cy="50" r="45"/>
                    <circle class="ring-fill" id="ring-fill" cx="50" cy="50" r="45"/>
                </svg>
                <div class="ring-center">
                    <div id="ring-cal" class="ring-cal">0</div>
                    <div class="ring-unit">KCAL</div>
                </div>
            </div>
            <div class="ring-info">
                <div id="ring-meta" class="meta-val">2000 kcal</div>
                <div id="ring-rest" class="rest-val">Calculando...</div>
            </div>
        </div>

        <div class="macros-row">
            <div class="macro-pill"><span id="mp" class="m-val">0g</span><span class="m-lbl">Prot</span></div>
            <div class="macro-pill"><span id="mc" class="m-val">0g</span><span class="m-lbl">Carb</span></div>
            <div class="macro-pill"><span id="mg" class="m-val">0g</span><span class="m-lbl">Gras</span></div>
        </div>

        <div id="meals-container"></div>
    </div>
