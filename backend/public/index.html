<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caloria·AR | Pro v3.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --bg:#F5F1EB;--surface:#FFFFFF;--surface2:#EDE9E1;
            --green:#2A4A2A;--green-mid:#3D6B3D;--green-lt:#D4E8D4;
            --terra:#C4614A;--terra-lt:#F5E0DB;
            --blue:#1D5FA5;--blue-lt:#E0EAF7;
            --text:#1C1C1A;--text2:#6B6860;--text3:#A09D98;
            --border:rgba(0,0,0,.08);--r:16px;--r-sm:10px;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;min-height:100vh;overflow-x:hidden}
        .hidden{display:none!important}
        
        /* ── DISCLAIMER ─── */
        .disclaimer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
        .disclaimer-box{background:var(--surface);border-radius:20px;max-width:440px;width:100%;padding:2rem}
        .disclaimer-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;color:var(--terra);text-align:center;margin-bottom:.8rem}
        .btn-primary{width:100%;padding:.85rem;background:var(--green);color:white;border:none;border-radius:var(--r-sm);font-family:'Syne',sans-serif;font-weight:700;cursor:pointer}
        .btn-primary:disabled{opacity:0.5;cursor:not-allowed}

        /* ── AUTH ─── */
        #view-auth{display:none;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
        #view-auth.active{display:flex}
        .auth-card{width:100%;max-width:420px;background:var(--surface);border-radius:24px;padding:2.5rem 2rem;border:1px solid var(--border)}
        .auth-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;color:var(--green);text-align:center;margin-bottom:1.5rem}
        .auth-tabs{display:flex;background:var(--surface2);border-radius:var(--r-sm);padding:3px;margin-bottom:1.8rem}
        .auth-tab{flex:1;padding:.5rem;text-align:center;font-size:.85rem;cursor:pointer;border-radius:8px}
        .auth-tab.active{background:var(--surface);font-weight:600}

        /* ── DASHBOARD ─── */
        #view-dash{display:none;flex-direction:column;max-width:480px;margin:0 auto;padding-bottom:7rem}
        #view-dash.active{display:flex}
        .dash-header{display:flex;align-items:center;justify-content:space-between;padding:1.4rem 1.25rem}
        .dash-brand{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--green)}
        
        .ring-card{background:var(--green);border-radius:24px;padding:1.4rem;display:flex;align-items:center;gap:1.4rem;margin:0 1rem .8rem;color:white}
        .ring-wrap{position:relative;width:100px;height:100px;flex-shrink:0}
        .ring-svg{transform:rotate(-90deg)}
        .ring-track{fill:none;stroke:rgba(255,255,255,.1);stroke-width:8}
        .ring-fill{fill:none;stroke:#7DC97D;stroke-width:8;stroke-dasharray:283;stroke-dashoffset:283;transition:all 1s}
        .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
        
        .water-card{background:var(--blue-lt);border:1px solid var(--blue);border-radius:var(--r);padding:1rem;margin:0 1rem .8rem}
        .water-glass-row{display:flex;gap:5px;margin-top:.7rem}
        .water-glass{flex:1;height:12px;border-radius:4px;background:rgba(0,0,0,.05)}
        .water-glass.full{background:var(--blue)}

        .form-input{width:100%;padding:.75rem;border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:10px}
        .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:white;display:flex;border-top:1px solid var(--border);z-index:100}
        .nav-item{flex:1;padding:1rem;text-align:center;font-size:.7rem;font-weight:700;color:var(--text3);cursor:pointer}
        .nav-item.active{color:var(--green)}
        
        .panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:white;border-radius:24px 24px 0 0;z-index:1000;transition:0.3s;padding:2rem}
        .panel.open{transform:translateX(-50%) translateY(0)}
        .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:999}
        .overlay.open{display:block}
        
        #reader{width:100%;background:black;border-radius:12px;margin-bottom:10px}
        .food-entry{background:white;padding:10px;border-radius:12px;margin-bottom:5px;border:1px solid var(--border);display:flex;justify-content:space-between}
    </style>
</head>
<body>

<div class="disclaimer-overlay" id="disclaimer">
    <div class="disclaimer-box">
        <div class="disclaimer-title">Aviso de Salud</div>
        <p style="font-size:.8rem; color:var(--text2); margin-bottom:1rem">Esta app es un proyecto académico de la UNPAZ. Consulta siempre a un profesional.</p>
        <label style="display:flex; gap:10px; margin-bottom:1rem; font-size:.8rem">
            <input type="checkbox" id="chk-disclaimer" onchange="document.getElementById('btn-disclaimer').disabled = !this.checked"> Acepto los términos
        </label>
        <button class="btn-primary" id="btn-disclaimer" disabled onclick="aceptarDisclaimer()">Empezar</button>
    </div>
</div>

<div id="view-auth" class="view">
    <div class="auth-card">
        <div class="auth-logo">Caloria<span>·</span>AR</div>
        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-login-btn" onclick="switchAuth('login')">Ingresar</div>
            <div class="auth-tab" id="tab-reg-btn" onclick="switchAuth('reg')">Registro</div>
        </div>
        <div id="form-login">
            <input class="form-input" type="email" id="l-email" placeholder="Email">
            <input class="form-input" type="password" id="l-pass" placeholder="Contraseña">
            <button class="btn-primary" onclick="doLogin()">Entrar</button>
        </div>
        <div id="form-reg" class="hidden">
            <input class="form-input" type="text" id="r-nombre" placeholder="Nombre">
            <input class="form-input" type="email" id="r-email" placeholder="Email">
            <input class="form-input" type="password" id="r-pass" placeholder="Contraseña">
            <button class="btn-primary" onclick="doRegister()">Crear Cuenta</button>
        </div>
    </div>
</div>

<div id="view-dash" class="view">
    <div class="dash-header">
        <div class="dash-brand">Caloria<span>·</span>AR</div>
        <button onclick="doLogout()" style="border:none; background:none; color:var(--terra); font-weight:700">Salir</button>
    </div>

    <div style="display:flex; justify-content:space-between; padding:0 1.5rem 1rem">
        <button onclick="cambiarFecha(-1)">‹</button>
        <span id="fecha-lbl" style="font-weight:800">Hoy</span>
        <button onclick="cambiarFecha(1)">›</button>
    </div>

    <div class="ring-card">
        <div class="ring-wrap">
            <svg class="ring-svg" width="100" height="100">
                <circle class="ring-track" cx="50" cy="50" r="45"/>
                <circle class="ring-fill" id="ring-fill" cx="50" cy="50" r="45"/>
            </svg>
            <div class="ring-center">
                <span id="ring-cal" style="font-weight:800; font-size:1.4rem">0</span>
                <span style="font-size:.6rem">kcal</span>
            </div>
        </div>
        <div>
            <div id="ring-meta" style="font-weight:800; font-size:1.1rem">2000 kcal</div>
            <div id="ring-rest" style="font-size:.75rem; opacity:0.8">Restantes...</div>
        </div>
    </div>

    <div class="water-card">
        <div style="display:flex; justify-content:space-between; align-items:center">
            <span style="font-weight:800; color:var(--blue)">💧 Agua</span>
            <div style="display:flex; gap:8px">
                <button onclick="ajustarAgua(-1)" style="border:none; padding:4px 10px; border-radius:6px">-</button>
                <button onclick="ajustarAgua(1)" style="border:none; background:var(--blue); color:white; padding:4px 10px; border-radius:6px">+</button>
            </div>
        </div>
        <div class="water-glass-row" id="agua-visual"></div>
        <div id="agua-txt" style="font-size:.65rem; margin-top:5px; color:var(--text2)">Cargando...</div>
    </div>

    <div id="ejer-list" style="padding:0 1rem; margin-bottom:1rem"></div>
    <div id="food-list" style="padding:0 1rem"></div>

    <button onclick="abrirBusqueda()" style="margin:1rem; padding:1rem; border-radius:15px; background:var(--green); color:white; border:none; font-weight:800">+ Registrar Actividad</button>
</div>

<nav class="bottom-nav hidden" id="main-nav">
    <div class="nav-item active">Dashboard</div>
    <div class="nav-item" onclick="alert('Próximamente: Gráficos')">Peso</div>
    <div class="nav-item" onclick="alert('Próximamente: Perfil')">Perfil</div>
</nav>

<div class="overlay" id="ov-busq" onclick="cerrarBusqueda()"></div>
<div class="panel" id="panel-busq">
    <div style="display:flex; gap:8px; margin-bottom:15px">
        <input class="form-input" type="text" id="busq-input" placeholder="Buscar alimento..." style="margin:0">
        <button onclick="iniciarEscaneo()" style="background:#eee; border:none; padding:10px; border-radius:10px">📷</button>
    </div>
    <div id="scanner-container" class="hidden">
        <div id="reader"></div>
        <button class="btn-primary" onclick="detenerEscaneo()" style="background:var(--terra); margin-bottom:10px">Cerrar Cámara</button>
    </div>
    <div id="busq-results"></div>
    
    <div style="margin-top:20px">
        <p style="font-weight:800; margin-bottom:10px">Ejercicio:</p>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">
            <button class="btn-primary" style="background:var(--terra)" onclick="regEjer('Caminata', 3.5)">🚶 Caminata</button>
            <button class="btn-primary" style="background:var(--terra)" onclick="regEjer('Correr', 8.0)">🏃 Correr</button>
        </div>
    </div>
</div>

<script>
// --- CONFIG & STATE ---
const API = '/api';
let token = localStorage.getItem('ca_token') || '';
let currentDate = new Date().toISOString().split('T')[0];
let currentRegId = null;
let html5QrCode = null;

// --- INITIALIZE ---
window.onload = () => {
    if(localStorage.getItem('ca_disclaimer')) {
        document.getElementById('disclaimer').classList.add('hidden');
        if(token) showDash(); else showAuth();
    }
};

function aceptarDisclaimer() {
    localStorage.setItem('ca_disclaimer', 'true');
    document.getElementById('disclaimer').classList.add('hidden');
    showAuth();
}

async function apiFetch(path, opts={}) {
    const headers = { 'Content-Type': 'application/json' };
    if(token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(API + path, { headers, ...opts });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Error');
    return data;
}

// --- AUTH ---
async function doLogin() {
    try {
        const body = { email: document.getElementById('l-email').value, pass: document.getElementById('l-pass').value };
        const d = await apiFetch('/auth/login', { method:'POST', body: JSON.stringify(body) });
        token = d.token; localStorage.setItem('ca_token', token);
        showDash();
    } catch(e) { alert(e.message); }
}

function showAuth() { 
    document.getElementById('view-auth').classList.add('active'); 
    document.getElementById('view-dash').classList.remove('active');
}

function showDash() {
    document.getElementById('view-auth').classList.remove('active');
    document.getElementById('view-dash').classList.add('active');
    document.getElementById('main-nav').classList.remove('hidden');
    cargarDia();
}

// --- CORE LOGIC v3.0 ---
async function cargarDia() {
    document.getElementById('fecha-lbl').textContent = currentDate;
    try {
        const d = await apiFetch('/logs/diario?fecha=' + currentDate);
        currentRegId = d.registro_diario_id;

        const cons = parseFloat(d.total_comida || 0);
        const ejer = parseFloat(d.total_ejercicio || 0);
        const meta = d.meta_calorica || 2000;
        const rest = meta - (cons - ejer);
        
        // Ring UI
        const pct = Math.min(cons / (meta + ejer), 1);
        document.getElementById('ring-fill').style.strokeDashoffset = 283 - (283 * pct);
        document.getElementById('ring-cal').textContent = Math.round(cons);
        document.getElementById('ring-meta').textContent = `${meta} kcal`;
        document.getElementById('ring-rest').textContent = `Restan: ${Math.round(rest)} kcal (Quemadas: ${Math.round(ejer)})`;

        // Agua UI
        const aguaAct = d.total_agua_ml || 0;
        const aguaMeta = d.meta_agua_ml || 2000;
        document.getElementById('agua-txt').textContent = `${aguaAct} / ${aguaMeta} ml`;
        const vasos = Math.floor(aguaAct / 250);
        let htmlA = '';
        for(let i=0; i<8; i++) htmlA += `<div class="water-glass ${i < vasos ? 'full' : ''}"></div>`;
        document.getElementById('agua-visual').innerHTML = htmlA;

        // Listas
        renderListas(d.ejercicios || [], d.alimentos || []);
    } catch(e) { console.error(e); }
}

async function ajustarAgua(inc) {
    if(!currentRegId) return;
    await apiFetch('/agua/ajustar', { 
        method:'POST', 
        body: JSON.stringify({ incremento_ml: inc * 250, registro_diario_id: currentRegId }) 
    });
    cargarDia();
}

async function regEjer(act, met) {
    const dur = prompt("¿Cuántos minutos?", "30");
    if(!dur) return;
    await apiFetch('/ejercicio', { 
        method:'POST', 
        body: JSON.stringify({ actividad: act, met, duracion: dur, registro_diario_id: currentRegId }) 
    });
    cerrarBusqueda(); cargarDia();
}

// --- SCANNER v3.0 ---
function iniciarEscaneo() {
    document.getElementById('scanner-container').classList.remove('hidden');
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
        detenerEscaneo();
        buscarBarcode(txt);
    });
}

async function buscarBarcode(code) {
    try {
        const p = await apiFetch('/alimentos/barcode/' + code);
        const gr = prompt(`Encontrado: ${p.nombre}. ¿Cuántos gramos consumiste?`, "100");
        if(gr) {
            // Aquí llamarías a tu endpoint de guardar alimento usando p.calorias_100g, etc.
            alert("¡Producto detectado! Implementa aquí el POST a /logs/comida");
        }
    } catch(e) { alert("Producto no encontrado en el catálogo."); }
}

function detenerEscaneo() {
    if(html5QrCode) html5QrCode.stop().then(() => document.getElementById('scanner-container').classList.add('hidden'));
}

// --- UTILS ---
function switchAuth(type) {
    document.getElementById('form-login').classList.toggle('hidden', type !== 'login');
    document.getElementById('form-reg').classList.toggle('hidden', type === 'login');
    document.getElementById('tab-login-btn').classList.toggle('active', type === 'login');
    document.getElementById('tab-reg-btn').classList.toggle('active', type !== 'login');
}
function cambiarFecha(inc) {
    let d = new Date(currentDate); d.setDate(d.getDate() + inc);
    currentDate = d.toISOString().split('T')[0];
    cargarDia();
}
function abrirBusqueda() { document.getElementById('ov-busq').classList.add('open'); document.getElementById('panel-busq').classList.add('open'); }
function cerrarBusqueda() { document.getElementById('ov-busq').classList.remove('open'); document.getElementById('panel-busq').classList.remove('open'); }
function renderListas(e, f) { /* Lógica para mostrar los items en los divs correspondientes */ }
function doLogout() { localStorage.clear(); location.reload(); }
</script>

</body>
</html>
