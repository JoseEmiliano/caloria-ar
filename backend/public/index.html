<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caloria·AR | Estable v2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <style>
        :root {
            --bg:#F5F1EB;--surface:#FFFFFF;--surface2:#EDE9E1;
            --green:#2A4A2A;--green-mid:#3D6B3D;--green-lt:#D4E8D4;
            --terra:#C4614A;--terra-lt:#F5E0DB;
            --text:#1C1C1A;--text2:#6B6860;--text3:#A09D98;
            --border:rgba(0,0,0,.08);--r:16px;--r-sm:10px;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;min-height:100vh;overflow-x:hidden}
        .hidden{display:none!important}

        /* ── MODAL DISCLAIMER ─── */
        .disclaimer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
        .disclaimer-box{background:var(--surface);border-radius:20px;max-width:440px;width:100%;padding:2rem}
        .disclaimer-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;color:var(--terra);text-align:center;margin-bottom:.8rem}
        .disclaimer-text{font-size:.85rem;color:var(--text2);line-height:1.7;margin-bottom:.6rem}
        .btn-primary{width:100%;padding:.85rem;background:var(--green);color:white;border:none;border-radius:var(--r-sm);font-family:'Syne',sans-serif;font-weight:700;cursor:pointer}
        .btn-primary:disabled{opacity:.5}

        /* ── AUTH ─── */
        #view-auth{display:none;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
        #view-auth.active{display:flex}
        .auth-card{width:100%;max-width:420px;background:var(--surface);border-radius:24px;padding:2.5rem 2rem;border:1px solid var(--border)}
        .auth-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;color:var(--green);text-align:center;margin-bottom:1.5rem}
        .auth-tabs{display:flex;background:var(--surface2);border-radius:var(--r-sm);padding:3px;margin-bottom:1.8rem}
        .auth-tab{flex:1;padding:.5rem;text-align:center;font-size:.85rem;cursor:pointer;border-radius:8px}
        .auth-tab.active{background:var(--surface);font-weight:600;color:var(--green)}

        /* ── DASHBOARD ─── */
        #view-dash{display:none;flex-direction:column;max-width:480px;margin:0 auto;padding-bottom:7rem}
        #view-dash.active{display:flex}
        .dash-header{display:flex;align-items:center;justify-content:space-between;padding:1.4rem 1.25rem}
        .dash-brand{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--green)}

        /* ── RING CALÓRICO ─── */
        .ring-card{background:var(--green);border-radius:24px;padding:1.4rem;display:flex;align-items:center;gap:1.4rem;margin-bottom:.8rem;color:white}
        .ring-wrap{position:relative;width:100px;height:100px;flex-shrink:0}
        .ring-svg{transform:rotate(-90deg)}
        .ring-track{fill:none;stroke:rgba(255,255,255,.15);stroke-width:9}
        .ring-fill{fill:none;stroke:#7DC97D;stroke-width:9;stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:283;transition:all 1s}
        .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
        
        .macros-row{display:flex;gap:.5rem;margin-bottom:.8rem}
        .macro-pill{flex:1;background:var(--surface);border-radius:12px;padding:.6rem .5rem;text-align:center;border:1px solid var(--border)}
        .macro-val{font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem}

        /* ── LISTS ─── */
        .food-entry{background:var(--surface);border-radius:12px;padding:.75rem .9rem;display:flex;align-items:center;gap:.7rem;border:1px solid var(--border);margin-bottom:.4rem}
        .food-info{flex:1;min-width:0}
        .food-name{font-weight:600;font-size:.85rem}
        .food-cal{font-family:'Syne',sans-serif;font-weight:700;color:var(--green)}

        /* ── NAV ─── */
        .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:white;display:flex;border-top:1px solid var(--border);z-index:100}
        .nav-item{flex:1;padding:1rem;text-align:center;font-size:.7rem;font-weight:700;color:var(--text3);cursor:pointer}
        .nav-item.active{color:var(--green)}
        
        /* ── PANELS ─── */
        .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:999}
        .overlay.open{display:block}
        .panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:white;border-radius:24px 24px 0 0;z-index:1000;transition:0.3s;padding:1.5rem}
        .panel.open{transform:translateX(-50%) translateY(0)}

        .form-input{width:100%;padding:.75rem;border:1.5px solid var(--border);border-radius:var(--r-sm);margin-bottom:10px;outline:none}
        .fab{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);width:calc(100% - 2.5rem);max-width:440px;padding:1rem;background:var(--green);color:white;border:none;border-radius:var(--r-sm);font-weight:800;cursor:pointer;z-index:90}
    </style>
</head>
<body>

<div class="disclaimer-overlay" id="disclaimer">
    <div class="disclaimer-box">
        <div class="disclaimer-title">Aviso Médico</div>
        <p class="disclaimer-text">Caloria·AR es un proyecto académico informativo. No reemplaza el consejo de un profesional de la salud.</p>
        <label style="display:flex; gap:10px; margin-bottom:1.5rem; font-size:.8rem">
            <input type="checkbox" id="chk-disclaimer"> Acepto los términos y condiciones
        </label>
        <button class="btn-primary" id="btn-disclaimer" disabled onclick="aceptarDisclaimer()">Empezar</button>
    </div>
</div>

<div id="view-auth" class="view">
    <div class="auth-card">
        <div class="auth-logo">Caloria<span>·</span>AR</div>
        <div class="auth-tabs">
            <div class="auth-tab active" id="t-login" onclick="switchAuth('login')">Ingresar</div>
            <div class="auth-tab" id="t-reg" onclick="switchAuth('register')">Registro</div>
        </div>
        <div id="f-login">
            <input class="form-input" type="email" id="l-email" placeholder="Email">
            <input class="form-input" type="password" id="l-pass" placeholder="Contraseña">
            <button class="btn-primary" onclick="doLogin()">Entrar</button>
        </div>
        <div id="f-reg" class="hidden">
            <input class="form-input" type="text" id="r-nombre" placeholder="Nombre">
            <input class="form-input" type="email" id="r-email" placeholder="Email">
            <input class="form-input" type="password" id="r-pass" placeholder="Contraseña (mín. 8)">
            <button class="btn-primary" onclick="doRegister()">Crear Cuenta</button>
        </div>
        <div class="hidden" id="auth-err" style="color:var(--terra); font-size:.8rem; margin-top:10px; text-align:center"></div>
    </div>
</div>

<div id="view-dash" class="view">
    <div class="dash-header">
        <div class="dash-brand">Caloria<span>·</span>AR</div>
        <button onclick="doLogout()" style="border:none; background:none; color:var(--terra); font-weight:700">Salir</button>
    </div>

    <div class="tab-section active" id="tab-calorias">
        <div style="display:flex; justify-content:space-between; padding:0 1.25rem 1rem">
            <button onclick="cambiarFecha(-1)">‹ Anterior</button>
            <span id="fecha-lbl" style="font-weight:800">Hoy</span>
            <button onclick="cambiarFecha(1)">Siguiente ›</button>
        </div>

        <div class="ring-card">
            <div class="ring-wrap">
                <svg class="ring-svg" width="100" height="100">
                    <circle class="ring-track" cx="50" cy="50" r="45"/>
                    <circle class="ring-fill" id="ring-fill" cx="50" cy="50" r="45"/>
                </svg>
                <div class="ring-center">
                    <div id="ring-cal" style="font-weight:800; font-size:1.4rem">0</div>
                    <div style="font-size:.6rem">kcal</div>
                </div>
            </div>
            <div>
                <div id="ring-meta" style="font-weight:800; font-size:1.1rem">2000 kcal</div>
                <div id="ring-rest" style="font-size:.75rem; opacity:0.8">Cargando...</div>
            </div>
        </div>

        <div class="macros-row" style="padding:0 1.25rem">
            <div class="macro-pill"><div class="macro-val" id="mp">0g</div><div style="font-size:.6rem">Prot</div></div>
            <div class="macro-pill"><div class="macro-val" id="mc">0g</div><div style="font-size:.6rem">Carb</div></div>
            <div class="macro-pill"><div class="macro-val" id="mg">0g</div><div style="font-size:.6rem">Gras</div></div>
        </div>

        <div id="meals-container" style="padding:0 1.25rem"></div>
    </div>

    <div class="tab-section" id="tab-peso">
        <div style="padding:1rem">
            <div class="card" id="imc-wrap" style="background:var(--green-lt); margin-bottom:1rem; text-align:center">
                <div id="imc-val" style="font-size:2rem; font-weight:800">--</div>
                <div id="imc-cat" style="font-weight:600">IMC</div>
            </div>
            <input class="form-input" type="number" id="p-input" placeholder="Peso en kg (ej 75.5)">
            <button class="btn-primary" onclick="registrarPeso()">Guardar Peso</button>
            <div class="chart-wrap" style="height:200px; margin-top:20px">
                <canvas id="peso-chart"></canvas>
            </div>
        </div>
    </div>

    <div class="tab-section" id="tab-perfil">
        <div style="padding:1rem">
            <div class="card">
                <label style="font-size:.7rem; font-weight:700">META CALÓRICA DIARIA</label>
                <input class="form-input" type="number" id="perf-meta" value="2000">
                <button class="btn-primary" onclick="guardarMeta()">Actualizar Meta</button>
            </div>
        </div>
    </div>
</div>

<button class="fab" id="fab" onclick="abrirBusqueda()">+ Registrar Comida</button>

<nav class="bottom-nav hidden" id="main-nav">
    <div class="nav-item active" id="n-cal" onclick="switchTab2('calorias')">Calorías</div>
    <div class="nav-item" id="n-peso" onclick="switchTab2('peso')">Peso</div>
    <div class="nav-item" id="n-perf" onclick="switchTab2('perfil')">Perfil</div>
</nav>

<div class="overlay" id="ov-busq" onclick="cerrarBusqueda()"></div>
<div class="panel" id="panel-busq">
    <input class="form-input" type="text" id="busq-input" placeholder="Buscar alimento (ej: Pollo)...">
    <div id="busq-results" style="max-height:300px; overflow-y:auto"></div>
    <button class="btn-primary" style="margin-top:10px; background:var(--terra)" onclick="cerrarBusqueda()">Cancelar</button>
</div>

<div class="overlay" id="ov-add" onclick="cerrarAdd()"></div>
<div class="panel" id="panel-add">
    <h3 id="add-nombre" style="margin-bottom:10px">---</h3>
    <label style="font-size:.8rem">Cantidad en gramos</label>
    <input class="form-input" type="number" id="add-qty" value="100">
    <button class="btn-primary" onclick="doAgregar()">Agregar al Diario</button>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('ca_token') || '';
let currentUser = JSON.parse(localStorage.getItem('ca_user') || 'null');
let currentDate = new Date().toISOString().split('T')[0];
let selectedFood = null;
let pesoChart = null;

// INIT
window.onload = () => {
    document.getElementById('chk-disclaimer').onchange = (e) => document.getElementById('btn-disclaimer').disabled = !e.target.checked;
    if(localStorage.getItem('ca_disclaimer')) {
        document.getElementById('disclaimer').classList.add('hidden');
        if(token) showDash(); else showAuth();
    }
};

async function apiFetch(path, opts={}) {
    const headers = { 'Content-Type': 'application/json' };
    if(token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(API + path, { headers, ...opts });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Error');
    return data;
}

// AUTH
async function doLogin() {
    try {
        const email = document.getElementById('l-email').value;
        const pass = document.getElementById('l-pass').value;
        const d = await apiFetch('/auth/login', { method:'POST', body: JSON.stringify({email, pass}) });
        token = d.token; currentUser = d.user;
        localStorage.setItem('ca_token', token); localStorage.setItem('ca_user', JSON.stringify(currentUser));
        showDash();
    } catch(e) { alert(e.message); }
}

async function doRegister() {
    try {
        const nombre = document.getElementById('r-nombre').value;
        const email = document.getElementById('r-email').value;
        const pass = document.getElementById('r-pass').value;
        const d = await apiFetch('/auth/register', { method:'POST', body: JSON.stringify({nombre, email, pass}) });
        token = d.token; currentUser = d.user;
        localStorage.setItem('ca_token', token); localStorage.setItem('ca_user', JSON.stringify(currentUser));
        showDash();
    } catch(e) { alert(e.message); }
}

function showAuth() { document.getElementById('view-auth').classList.add('active'); }
function showDash() { 
    document.getElementById('view-auth').classList.remove('active');
    document.getElementById('view-dash').classList.add('active');
    document.getElementById('main-nav').classList.remove('hidden');
    cargarDia();
}

// DASHBOARD
async function cargarDia() {
    document.getElementById('fecha-lbl').textContent = currentDate;
    try {
        const d = await apiFetch('/logs/diario?fecha=' + currentDate);
        const cons = d.total_calorias || 0;
        const meta = d.meta_calorica || 2000;
        const rest = d.calorias_restantes;
        const pct = Math.min(cons / meta, 1);

        document.getElementById('ring-fill').style.strokeDashoffset = 283 - (283 * pct);
        document.getElementById('ring-cal').textContent = Math.round(cons);
        document.getElementById('ring-meta').textContent = meta + ' kcal';
        document.getElementById('ring-rest').textContent = rest > 0 ? rest + ' restantes' : 'Meta cumplida';
        
        document.getElementById('mp').textContent = Math.round(d.total_proteinas || 0) + 'g';
        document.getElementById('mc').textContent = Math.round(d.total_carbos || 0) + 'g';
        document.getElementById('mg').textContent = Math.round(d.total_grasas || 0) + 'g';

        renderComidas(d.por_tipo || {});
    } catch(e) { console.error(e); }
}

function renderComidas(tipos) {
    let html = '';
    for(const t in tipos) {
        tipos[t].forEach(f => {
            html += `<div class="food-entry">
                <div class="food-info"><b>${f.nombre_alimento}</b><br><small>${f.cantidad_gramos}g</small></div>
                <div class="food-cal">${Math.round(f.calorias_totales)}</div>
                <button onclick="borrarEntry('${f.id}')" style="margin-left:10px; border:none; background:none">✕</button>
            </div>`;
        });
    }
    document.getElementById('meals-container').innerHTML = html || '<div style="text-align:center; padding:20px; opacity:0.5">Sin registros hoy</div>';
}

async function borrarEntry(id) {
    if(!confirm('¿Borrar?')) return;
    await apiFetch('/logs/' + id, { method:'DELETE' });
    cargarDia();
}

// BUSQUEDA
let searchTimer;
document.getElementById('busq-input').oninput = (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => doBuscar(e.target.value), 400);
};

async function doBuscar(q) {
    if(q.length < 2) return;
    const d = await apiFetch('/alimentos/buscar?q=' + q);
    document.getElementById('busq-results').innerHTML = d.resultados.map(r => `
        <div onclick='seleccionarAlimento(${JSON.stringify(r)})' style="padding:10px; border-bottom:1px solid #eee; cursor:pointer">
            <b>${r.nombre}</b><br><small>${r.marca} - ${r.calorias_100g} kcal/100g</small>
        </div>
    `).join('');
}

function seleccionarAlimento(f) {
    selectedFood = f;
    document.getElementById('add-nombre').textContent = f.nombre;
    cerrarBusqueda();
    document.getElementById('ov-add').classList.add('open');
    document.getElementById('panel-add').classList.add('open');
}

async function doAgregar() {
    const qty = document.getElementById('add-qty').value;
    await apiFetch('/logs', { method:'POST', body: JSON.stringify({
        nombre_alimento: selectedFood.nombre,
        calorias_100g: selectedFood.calorias_100g,
        proteinas_100g: selectedFood.proteinas_100g,
        carbohidratos_100g: selectedFood.carbohidratos_100g,
        grasas_100g: selectedFood.grasas_100g,
        cantidad_gramos: qty,
        fecha: currentDate
    })});
    cerrarAdd(); cargarDia();
}

// UTILS UI
function switchTab2(tab) {
    document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('tab-'+tab).classList.add('active');
    document.getElementById('n-'+tab.substring(0,3)).classList.add('active');
    document.getElementById('fab').classList.toggle('hidden', tab !== 'calorias');
}
function cambiarFecha(n) {
    let d = new Date(currentDate); d.setDate(d.getDate() + n);
    currentDate = d.toISOString().split('T')[0];
    cargarDia();
}
function aceptarDisclaimer() { localStorage.setItem('ca_disclaimer', 'true'); document.getElementById('disclaimer').classList.add('hidden'); showAuth(); }
function abrirBusqueda() { document.getElementById('ov-busq').classList.add('open'); document.getElementById('panel-busq').classList.add('open'); }
function cerrarBusqueda() { document.getElementById('ov-busq').classList.remove('open'); document.getElementById('panel-busq').classList.remove('open'); }
function cerrarAdd() { document.getElementById('ov-add').classList.remove('open'); document.getElementById('panel-add').classList.remove('open'); }
function doLogout() { localStorage.clear(); location.reload(); }
</script>

</body>
</html>
